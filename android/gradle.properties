org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true

# OneDrive 등 클라우드 동기화 경로: VFS 감시가 파일 잠금·cleanMergeDebugAssets 실패를 유발하는 경우가 있음.
org.gradle.vfs.watch=false
# Windows: 병렬 빌드가 :jni:stripDebugDebugSymbols 등에서 출력 정리 실패(파일 잠금)를 유발하는 경우가 있음.
org.gradle.parallel=false
org.gradle.caching=true

# SUBST(L:)로 빌드할 때 플러그인 소스는 보통 C:\Users\...\Pub\Cache 에 있어,
# Kotlin 증분 캐시가 "different roots" 로 깨질 수 있음(device_info_plus 등).
kotlin.incremental=false
