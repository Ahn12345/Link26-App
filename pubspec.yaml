name: link26_app
description: Link26 mobile app (Android & iOS).
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.4.0
  dio: ^5.7.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  crypto: ^3.0.7
  google_generative_ai: ^0.4.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - lib/data/DUR1/
    - lib/data/DUR2/
