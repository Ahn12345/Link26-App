# Gradle 빌드는 OneDrive 동기화 폴더 밖(예: C:\dev\Link26-App 복사본)에서 실행하는 것을 권장합니다.
name: link26_app
description: Link26 mobile app (Android & iOS).
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.4.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  crypto: ^3.0.7
  google_generative_ai: ^0.4.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4
  xml: ^6.6.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/applogo.png
  adaptive_icon_background: "#EEF4FA"
  adaptive_icon_foreground: assets/images/applogo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/design/
    - assets/design/png/
    - assets/images/
    # DUR CSV 는 현재 Dart 에서 로드하지 않음 — APK/AAB 용량 절감을 위해 번들에서 제외.
    # 필요 시 네트워크·다운로드 또는 별도 모듈로 제공하세요.
