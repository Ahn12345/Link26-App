# Gradle 빌드는 OneDrive 동기화 폴더 밖(예: C:\dev\Link26-App 복사본)에서 실행하는 것을 권장합니다.
# 경로에 한글이 있으면 plain `flutter run` 대신: .\flutterw.ps1 run
# cleanMergeDebugAssets 잠금 시: .\flutterw.ps1 -CleanBuild run  또는  .\tool\clean_flutter_ephemeral.ps1
name: link26_app
description: Link26 mobile app (Android & iOS).
publish_to: "none"

version: 1.0.0+25

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.4.0
  dio: ^5.7.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  crypto: ^3.0.7
  google_generative_ai: ^0.4.7
  image_picker: ^1.1.2
  path: ^1.9.1
  xml: ^6.6.1
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  device_info_plus: ^13.1.0
  url_launcher: ^6.3.1
  speech_to_text: ^7.3.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  image: ^4.5.4
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  test: ^1.30.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/applogo.png
  adaptive_icon_background: "#EEF4FA"
  adaptive_icon_foreground: assets/images/applogo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    # 루트 .env 는 OneDrive/Gradle 스냅샷 이슈 가능 — 빌드 전 sync_dotenv_asset.ps1 가 아래로 복사
    - assets/env/dotenv
    - assets/design/
    - assets/design/png/
    - assets/design/screens/
    - assets/images/
    - assets/legal/privacy_consent.pdf
    # AI 채팅 DUR 로컬 검색 (용량 큼 — 릴리즈 시 모듈/다운로드로 옮길 수 있음)
    - lib/data/DUR1/
    - lib/data/DUR2/
